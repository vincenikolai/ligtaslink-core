name: ligtaslink_mobile
description: LigtasLink offline-first, blockchain-anchored relief verification for Barangay 33-D, Davao City.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  sqflite_common_ffi_web: '>=0.4.5 <2.0.0'
  path: ^1.9.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  mobile_scanner: '>=6.0.0 <8.0.0'
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/barangay_33d_households.json
